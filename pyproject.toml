[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mergeworthy"
dynamic = ["version"]
description = "An autonomous open-source contributor that only submits work a human has approved."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aakash Siwach" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
]

[project.scripts]
mergeworthy = "mergeworthy.cli:app"

[tool.hatch.version]
path = "src/mergeworthy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mergeworthy"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM300"]  # flags comparisons with upper-case constants as Yoda conditions

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mergeworthy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
